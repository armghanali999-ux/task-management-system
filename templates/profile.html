{% extends "base.html" %}
{% block title %}Profile | TaskFlow{% endblock %}
{% block content %}<section class="mx-auto" style="max-width: 42rem"><h1>Profile</h1><form data-form="profile" class="card card-body gap-3"><label>Email<input class="form-control" name="email" disabled></label><div class="row"><label class="col">First name<input class="form-control" name="first_name"></label><label class="col">Last name<input class="form-control" name="last_name"></label></div><label>Phone<input class="form-control" name="phone"></label><label>Bio<textarea class="form-control" name="bio"></textarea></label><button class="btn btn-primary">Save profile</button><div class="alert alert-danger" data-form-error hidden></div></form></section>{% endblock %}
